<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelas Aiman</title>
  <style> 
  * { box-sizing: border-box; 
  
  } 
  body { 
        min-height: 90vh; 
        display: block; 
        font-family: Arial, sans-serif;
        color: #f0e8e8; 
        background: #d7e197; 
        margin: 0; 
        padding: 0; 
         
        } 
         
  .welcome-card { 
  
    padding: 10px 25px; 
    text-align: left; 
    border: 1px solid rgba(255, 255, 255, .35); 
    border-radius: 24px; 
    background: #df72b5; 
    box-shadow: 0 10px 45px rgba(30, 20, 80, .25); 
    backdrop-filter: blur(10px); 
  } 
    
    .welcome-content { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      gap: 30px;
    } 
     
     .welcome-image { 
      width: 160px; 
      height: 210px; 
      object-fit: cover; 
      border-radius: 10px; 
    } 
    
    h1 { 
      
      margin: 0; 
      font-size: clamp(4.2rem, 7vw, 4.5rem); 
      line-height: 1.1; 
      font-family: "Times New Roman", Times, serif;
    } 
    
    h2 { 
      margin: 35px 0 10px; 
      font-size: 2.2rem; 
      line-height: 1.1; 
      font-family: "Copperplate", serif; 
      text-align: center; 
      color: #3d2c3d; 
      
      } 
      
      h4 { font-family: "Times New Roman", Times, serif; 
      
      }  
      
      table { 
        width: 80%; 
        margin: 25px auto 50px; 
        border-collapse: collapse; 
        background: white; 
        color: #3d2c3d; 
        border-radius: 15px; 
        overflow: hidden; 
        box-shadow: 0 8px 25px rgba(30, 20, 80, .15); 
        
        }  
        
        th { 
        background: #df72b5; 
        color: white; 
        padding: 15px; 
        font-family: "Copperplate", serif; 
        font-size: 18px; 
        
        } 
        
        td { 
          padding: 15px; 
          text-align: center; 
          border-bottom: 1px solid #ead6e3; 
          font-family: Arial, sans-serif; 
          font-size: 16px; 
          
          } 
          
          tr:nth-child(even) { 
            background: #f9edf5; 
          } 
          
          tr:hover { 
            background: #edf0c9; 
            } 
            
            </style>
</head>

<body>
  <main class="welcome-card">

  <div class="welcome-content">

    <div class="welcome-text">
     <h1>Selamat Datang ke<br>Kelas Aiman</h1>
      <h4>#ini kelas khas untuk mar je</h4>
    </div>

    <img src="gambar resume mar.png" class="welcome-image">
  </div>

</main>

  <h2>JADUAL WAKTU</h2>

<table>
  
  <tr> <th>HARI</th> 
      <th>MASA</th> 
      <th>KELAS</th> 
  </tr> 
  
  <tr> 
    <td>Isnin</td> 
    <td>8:30 - 9:30</td> 
    <td>Programming</td> 
  </tr> 
  
  <tr> 
    <td>Selasa</td> 
    <td>8:30 - 9:30</td> 
    <td>Programming</td> 
  </tr> 
  
  <tr> 
    <td>Rabu</td> 
    <td>8:30 - 9:30</td> 
    <td>Programming</td> 
  </tr>
</table>

</body>
</html>
